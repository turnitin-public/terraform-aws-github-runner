matcherConfig:
  exactMatch: true
  labelMatchers:
    - [self-hosted, windows, x64, servercore-2022]
fifo: true
runner_config:
  runner_os: windows
  runner_architecture: x64
  runner_name_prefix: servercore-2022-x64_
  enable_ssm_on_runners: true
  instance_types:
    - m5.large
    - c5.large
  runners_maximum_count: 1
  enable_ephemeral_runners: true
  delay_webhook_event: 0
  scale_down_schedule_expression: cron(* * * * ? *)
  runner_boot_time_in_minutes: 20
  minimum_running_time_in_minutes: 25 # must exceed runner_boot_time_in_minutes, else scale-down reaps runners while they are still booting
  ami:
    filter:
      name:
        - Windows_Server-2022-English-Full-ECS_Optimized-*
      state:
        - available
